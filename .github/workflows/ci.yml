name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Тесты, покрытие, анализ кода, документация (${{ matrix.lab }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: [lab1, lab2]
    defaults:
      run:
        working-directory: ${{ matrix.lab }}
    steps:
      - uses: actions/checkout@v4
      - name: Установка инструментов
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck doxygen
          pip install gcovr
      - name: Сборка с измерением покрытия
        run: |
          cmake -S . -B build -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
      - name: Запуск тестов
        run: ctest --test-dir build --output-on-failure
      - name: Проверка покрытия (не менее 90%)
        run: gcovr -r . --object-directory build --filter 'src/' --fail-under-line 90 --print-summary
      - name: Статический анализ
        run: cppcheck --enable=warning,performance --error-exitcode=1 --std=c++17 -I include src app
      - name: Генерация документации Doxygen
        run: doxygen Doxyfile

  build-windows:
    name: Сборка под Windows (${{ matrix.lab }})
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - lab: lab1
            package: build/bin/dictionary_app.exe, build/bin/fifteen_app.exe, data
          - lab: lab2
            package: build/bin/culinary_app.exe
    defaults:
      run:
        working-directory: ${{ matrix.lab }}
    steps:
      - uses: actions/checkout@v4
      - name: Сборка
        run: |
          cmake -S . -B build -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release
      - name: Тесты
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Упаковка
        run: Compress-Archive -Path ${{ matrix.package }} -DestinationPath ${{ matrix.lab }}-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-windows
          path: ${{ matrix.lab }}/${{ matrix.lab }}-windows.zip

  release:
    name: Публикация в Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-windows'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '*-windows.zip'
